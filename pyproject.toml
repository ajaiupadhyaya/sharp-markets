[project]
name = "sharpmkt"
version = "0.1.0"
description = "Are prediction markets sharp? Kalshi and Polymarket against the Betfair Exchange closing line in European football"
authors = [
    { name = "ajaiupadhyaya", email = "ajaiupadhyaya@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: needs built data under data/"]
